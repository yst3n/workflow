<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
    <h1>WorkFlow Task Manager</h1>
    

    <div><label>Enter task title:</label>
       
        <input type="text" id="taskInput" class="form-control">
    </div>
    <div>
     <button class="btn btn-primary lg mb-3 btn mt-2" onclick="addTask()">Submit</button>
    </div>



    <div>
        <p>Counter:<span id="taskCounter">0</span> </p>

        <div class = "d-flex justify-content-center">
            <button class="btn btn-primary btn-sm mb-2 me-1" onclick="showTasks('all')">All Tasks</button>
            <button class="btn btn-success btn-sm mb-2 me-1" onclick="showTasks('completed')">Completed Tasks</button>
            <button class="btn btn-warning btn-sm mb-2" onclick="showTasks('pending')">Pending Tasks</button>
        </div>

        <input id="searchInput" class="form-control mb-3" placeholder="Search tasks..." oninput="showTasks()">
        <!-- tghallima! -->



        <ul class="list-group" id="taskList">
            <li class="list-group-item">tesasddat</li>
        

        </ul>
    </div>

    </div>
    <script src = "script.js"></script>
</body>

</html>
